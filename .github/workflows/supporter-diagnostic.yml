name: Supporter diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supporter-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect recent supporter responses and schema
        run: |
          npx --yes wrangler@4.157.0 d1 execute REUSE_DB --remote --command "SELECT occurred_at, method, path, status, duration_ms FROM access_log_events WHERE path LIKE '/api/supporter/%' ORDER BY occurred_at DESC LIMIT 30; PRAGMA table_info(supporter_accounts); SELECT COUNT(*) AS supporter_accounts FROM supporter_accounts;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
