name: Deploy main-dpi

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-dpi-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Apply D1 migrations
        run: npx --yes wrangler@4.157.0 d1 migrations apply REUSE_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure survey secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEY_FORM_URL"
          test -n "$SURVEY_SUBMISSION_SECRET"
          test -n "$SURVEY_DATA_SECRET"
          printf '%s' "$SURVEY_FORM_URL" | npx --yes wrangler@4.157.0 secret put SURVEY_FORM_URL
          printf '%s' "$SURVEY_SUBMISSION_SECRET" | npx --yes wrangler@4.157.0 secret put SURVEY_SUBMISSION_SECRET
          printf '%s' "$SURVEY_DATA_SECRET" | npx --yes wrangler@4.157.0 secret put SURVEY_DATA_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SURVEY_FORM_URL: ${{ secrets.SURVEY_FORM_URL }}
          SURVEY_SUBMISSION_SECRET: ${{ secrets.SURVEY_SUBMISSION_SECRET }}
          SURVEY_DATA_SECRET: ${{ secrets.SURVEY_DATA_SECRET }}

      - name: Deploy main-dpi
        run: npx --yes wrangler@4.157.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
