name: Deploy main-dpi

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-dpi-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Apply D1 migrations
        run: npx --yes wrangler@4.157.0 d1 migrations apply REUSE_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy main-dpi with survey secrets
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/main-dpi-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const fs = require("node:fs");
            const names = ["SURVEY_FORM_URL", "SURVEY_SUBMISSION_SECRET", "SURVEY_DATA_SECRET"];
            const values = Object.fromEntries(names.map(name => [name, process.env[name] || ""]));
            if (Object.values(values).some(value => !value)) throw new Error("Required survey secret is missing");
            fs.writeFileSync(process.argv[1], JSON.stringify(values), {mode: 0o600});
          ' "$secrets_file"
          npx --yes wrangler@4.157.0 deploy --secrets-file "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SURVEY_FORM_URL: ${{ secrets.SURVEY_FORM_URL }}
          SURVEY_SUBMISSION_SECRET: ${{ secrets.SURVEY_SUBMISSION_SECRET }}
          SURVEY_DATA_SECRET: ${{ secrets.SURVEY_DATA_SECRET }}
