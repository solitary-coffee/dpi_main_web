<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>統合管理センター - DPI-Bot</title>
    <link rel="icon" href="../../img/dpi.png" type="image/png">
    <link rel="stylesheet" href="../admin-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-shell" data-admin-page="overview">
    <button id="menu-toggle-btn" type="button" aria-label="メニューを開く"><span></span><span></span><span></span></button>
    <div class="overlay"></div>
    <div class="page-container">
        <nav class="sidebar" aria-label="管理メニュー">
            <div class="sidebar-header"><h2>管理メニュー</h2></div>
            <ul>
                <li><a href="/">公式サイト</a></li>
                <li><a href="/site/admin-center/" class="active">統合管理センター</a></li>
                <li><a href="/site/system-admin/">システム運用</a></li>
                <li><a href="/site/ec2-admin/">EC2管理</a></li>
                <li><a href="/site/xml-admin/">XML配信</a></li>
                <li><a href="/site/status-admin/">ステータス管理</a></li>
                <li><a href="/site/delivery-admin/">配信統計</a></li>
                <li><a href="/site/delivery-flow-admin/">配信系統</a></li>
                <li><a href="/site/system-admin/audit/">監査ログ</a></li>
                <li><a href="/site/channel-admin/">配信先検索</a></li>
                <li><a href="/site/reuse-admin/">二次利用申請管理</a></li>
                <li><a href="/site/mail-admin/">メール配信管理</a></li>
                <li><a href="/site/discord-admin/">Discordお知らせ管理</a></li>
                <li><a href="/site/ip-admin/">IP遮断管理</a></li>
                <li><a href="/cdn-cgi/access/logout">ログアウト</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <header class="topbar">
                <div><p class="eyebrow">OPERATIONS OVERVIEW</p><h1>統合管理センター</h1></div>
                <div class="admin-bar"><span id="admin-email"></span><button id="refresh-btn" type="button">最新情報に更新</button></div>
            </header>
            <div id="global-status" class="status" role="alert" aria-live="assertive"></div>

            <section aria-labelledby="overview-title">
                <div class="section-heading"><div><p class="eyebrow">OVERVIEW</p><h2 id="overview-title">管理状況の概要</h2></div><time id="fetched-at"></time></div>
                <div id="overview-cards" class="metric-grid"></div>
            </section>

            <section aria-labelledby="operations-title">
                <div class="section-heading"><div><p class="eyebrow">OPERATIONS</p><h2 id="operations-title">システム・配信の概要</h2></div><p>詳細確認や操作は各管理タブから行えます。</p></div>
                <div id="operation-overview" class="feature-grid"></div>
            </section>

            <section aria-labelledby="links-title">
                <div class="section-heading"><div><p class="eyebrow">MANAGEMENT</p><h2 id="links-title">各管理画面</h2></div></div>
                <div id="quick-links" class="quick-links"></div>
            </section>
        </main>
    </div>
    <script src="../../script.js"></script>
    <script src="script.js"></script>
</body>
</html>
