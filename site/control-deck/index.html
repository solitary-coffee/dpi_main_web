<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0b0f14">
    <meta name="mobile-web-app-capable" content="yes">
    <title>操作盤 - DPI-Bot</title>
    <link rel="icon" href="../../img/dpi.png" type="image/png">
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
    <link rel="stylesheet" href="deck.css">
</head>
<body class="deck">
    <header class="deck-top">
        <div class="deck-clock"><span id="clock-time">--:--:--</span><span id="clock-date" class="deck-muted"></span></div>
        <div class="deck-lamps" id="lamps" aria-label="積層灯の表示"></div>
        <div id="status" class="deck-status deck-muted" role="status" aria-live="polite">読み込み中…</div>
    </header>

    <main class="deck-main">
        <div class="deck-info">
        <section class="deck-panel deck-delivery" aria-labelledby="delivery-title">
            <h2 id="delivery-title">配信（直近24時間）<span id="delivery-updated" class="deck-muted deck-small"></span></h2>
            <div class="deck-kpis">
                <div class="deck-kpi"><span class="deck-kpi-label">配信</span><strong id="kpi-events">—</strong><small id="kpi-hour" class="deck-muted"></small></div>
                <div class="deck-kpi"><span class="deck-kpi-label">送信先</span><strong id="kpi-targets">—</strong><small id="kpi-rate" class="deck-muted"></small></div>
                <div class="deck-kpi" id="kpi-errors-box"><span class="deck-kpi-label">要対応の失敗</span><strong id="kpi-errors">—</strong><small id="kpi-serious" class="deck-muted"></small></div>
                <div class="deck-kpi"><span class="deck-kpi-label">最大遅延</span><strong id="kpi-latency">—</strong><small class="deck-muted">最も遅い送信先</small></div>
            </div>
            <div id="delivery-types" class="deck-types"></div>
            <ul id="delivery-recent" class="deck-list"><li class="deck-muted">読み込み中…</li></ul>
        </section>

        <section class="deck-panel deck-now" aria-labelledby="now-title">
            <h2 id="now-title">いま起きていること</h2>
            <ul id="conditions" class="deck-list"><li class="deck-muted">読み込み中…</li></ul>
        </section>

        <section class="deck-panel deck-history" aria-labelledby="history-title">
            <h2 id="history-title">直近の履歴（24時間）</h2>
            <ul id="history" class="deck-list"><li class="deck-muted">読み込み中…</li></ul>
        </section>
        </div>

        <section class="deck-grid" aria-label="操作">
            <!-- 1 段目: 積層灯の操作 -->
            <button class="deck-tile deck-accent" type="button" data-command="ack"><span class="deck-icon">✓</span><span>確認<small>点いているものを消す</small></span></button>
            <button class="deck-tile deck-danger" type="button" data-command="fullstop_on" data-hold="1"><span class="deck-icon">■</span><span>強制停止<small>1秒長押し</small></span></button>
            <button class="deck-tile" type="button" data-command="fullstop_off"><span class="deck-icon">▶</span><span>強制停止を解除</span></button>
            <button class="deck-tile" type="button" id="night-tile"><span class="deck-icon">☾</span><span id="night-label">夜間モード</span></button>
            <button class="deck-tile" type="button" id="wake-tile"><span class="deck-icon">☀</span><span id="wake-label">画面を消さない: OFF</span></button>
            <button class="deck-tile" type="button" id="refresh-tile"><span class="deck-icon">⟳</span><span>今すぐ更新</span></button>
            <!-- 2 段目: 一時停止（自動表示を止める） -->
            <button class="deck-tile deck-warn" type="button" data-snooze="1" data-hold="1"><span class="deck-icon">⏸</span><span>1時間停止<small>1秒長押し</small></span></button>
            <button class="deck-tile deck-warn" type="button" data-snooze="6" data-hold="1"><span class="deck-icon">⏸</span><span>6時間停止<small>1秒長押し</small></span></button>
            <button class="deck-tile deck-warn" type="button" data-snooze="custom" data-hold="1"><span class="deck-icon">⏱</span><span>カスタム時間<small>1秒長押し</small></span></button>
            <button class="deck-tile deck-danger" type="button" data-snooze="forever" data-hold="3"><span class="deck-icon">⏹</span><span>無期限停止<small>3秒長押し</small></span></button>
            <button class="deck-tile" type="button" data-snooze="0"><span class="deck-icon">⏵</span><span>停止を解除</span></button>
            <button class="deck-tile" type="button" id="fullscreen-tile"><span class="deck-icon">⛶</span><span>全画面</span></button>
            <!-- 3 段目: ページを開く -->
            <a class="deck-tile deck-link" href="/site/patlite-admin/"><span class="deck-icon">◎</span><span>積層灯ページ</span></a>
            <a class="deck-tile deck-link" href="https://api-dp.jr226toritetu.workers.dev/realtime/"><span class="deck-icon">📈</span><span>監視サイト</span></a>
            <a class="deck-tile deck-link" href="/site/delivery-admin/"><span class="deck-icon">▤</span><span>配信統計</span></a>
            <a class="deck-tile deck-link" href="/site/delivery-flow-admin/"><span class="deck-icon">⇄</span><span>配信系統</span></a>
            <a class="deck-tile deck-link" href="/site/system-admin/"><span class="deck-icon">⚙</span><span>システム運用</span></a>
            <a class="deck-tile deck-link" href="/site/admin-center/"><span class="deck-icon">⌂</span><span>管理センター</span></a>
        </section>
    </main>
    <dialog id="custom-dialog" class="deck-dialog" aria-labelledby="custom-title">
        <form method="dialog">
            <h2 id="custom-title">何時間止めますか？</h2>
            <p class="deck-muted">積層灯の自動表示を止めます（重大な障害・防災情報も点きません）。最長 168 時間（7日）。</p>
            <div class="deck-dialog-quick">
                <button type="button" data-hours="2">2時間</button>
                <button type="button" data-hours="3">3時間</button>
                <button type="button" data-hours="12">12時間</button>
                <button type="button" data-hours="24">24時間</button>
                <button type="button" data-hours="72">3日</button>
            </div>
            <label class="deck-dialog-input"><input type="number" id="custom-hours" min="0.5" max="168" step="0.5" value="3" inputmode="decimal"> 時間</label>
            <div class="deck-dialog-actions">
                <button type="submit" value="cancel">やめる</button>
                <button type="submit" value="ok" class="deck-dialog-ok">この時間止める</button>
            </div>
        </form>
    </dialog>
    <div id="toast" class="deck-toast" role="alert" hidden></div>
    <script type="module" src="deck.js"></script>
</body>
</html>
