<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>二次利用申請管理 - DPI-Bot</title>
    <link rel="icon" href="../../img/dpi.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../admin-shell.css">
</head>
<body class="admin-shell">
    <button id="menu-toggle-btn" type="button" aria-label="メニューを開く"><span></span><span></span><span></span></button>
    <div class="overlay"></div>
    <div class="page-container">
        <nav class="sidebar" aria-label="管理メニュー">
            <div class="sidebar-header"><h2>管理メニュー</h2></div>
            <ul>
                <li><a href="/">公式サイト</a></li>
                <li><a href="/site/admin-center/">統合管理センター</a></li>
                <li><a href="/site/system-admin/">システム運用</a></li>
                <li><a href="/site/ec2-admin/">EC2管理</a></li>
                <li><a href="/site/xml-admin/">XML配信</a></li>
                <li><a href="/site/channel-admin/">配信先検索</a></li>
                <li><a href="/site/reuse-admin/" class="active">二次利用申請管理</a></li>
                <li><a href="/site/mail-admin/">メール配信管理</a></li>
                <li><a href="/site/ip-admin/">IP遮断管理</a></li>
                <li><a href="/cdn-cgi/access/logout">ログアウト</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header>
                <h1>二次利用申請管理</h1>
                <div class="admin-bar"><span id="admin-email"></span><button id="refresh-btn" type="button">最新情報に更新</button></div>
            </header>
            <div id="status" class="status" role="alert" aria-live="assertive"></div>
            <section class="stats" id="stats" aria-label="申請件数"></section>
            <section class="filters" aria-label="絞り込み">
                <button type="button" data-status="all" class="active">すべて</button>
                <button type="button" data-status="pending">審査中</button>
                <button type="button" data-status="resubmitted">再申請</button>
                <button type="button" data-status="changes_requested">再申請待ち</button>
                <button type="button" data-status="approved">許可</button>
                <button type="button" data-status="rejected">却下</button>
                <button type="button" data-status="stop_requested">停止申請中</button>
                <button type="button" data-status="stopped">利用停止</button>
            </section>
            <div class="workspace">
                <section id="application-list" class="application-list" aria-label="申請一覧"></section>
                <section id="detail" class="detail empty"><p>一覧から申請を選択してください。</p></section>
            </div>
            <dialog id="admin-confirmation-dialog" aria-labelledby="admin-confirmation-title">
                <div class="admin-confirmation-panel">
                    <h2 id="admin-confirmation-title">送信内容の確認</h2>
                    <p id="admin-confirmation-summary"></p>
                    <dl id="admin-confirmation-details" class="detail-grid"></dl>
                    <section class="admin-confirmation-message"><h3>送信するメッセージ</h3><pre id="admin-confirmation-message"></pre></section>
                    <div class="admin-confirmation-actions">
                        <button id="admin-confirmation-cancel" type="button">修正する</button>
                        <button id="admin-confirmation-submit" type="button">内容を確認して送信</button>
                    </div>
                </div>
            </dialog>
        </main>
    </div>
    <script src="../../script.js"></script>
    <script src="script.js"></script>
</body>
</html>
