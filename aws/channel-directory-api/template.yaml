AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DPI-Bot administrator channel directory read API

Parameters:
  DirectoryApiToken:
    Type: String
    NoEcho: true
    MinLength: 32
  TableName:
    Type: String
    Default: EarthquakeData
  MonitoredTableNames:
    Type: String
    Default: EarthquakeData
    Description: Comma-separated DynamoDB table names shown in the administrator system summary.
  HomeServerTableName:
    Type: String
    Default: ''
    Description: Optional DynamoDB heartbeat table for home servers.

Resources:
  ChannelDirectoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dpi-channel-directory-api
      Description: Read-only administrator search API for DPI-Bot delivery destinations
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: lambda_function.lambda_handler
      CodeUri: .
      MemorySize: 384
      Timeout: 25
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          DIRECTORY_API_TOKEN: !Ref DirectoryApiToken
          MONITORED_TABLE_NAMES: !Ref MonitoredTableNames
          HOME_SERVER_TABLE_NAME: !Ref HomeServerTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TableName
        - Statement:
            - Sid: ReadOperationalInventory
              Effect: Allow
              Action:
                - lambda:ListFunctions
                - apigateway:GET
                - sqs:ListQueues
                - sqs:GetQueueAttributes
                - dynamodb:ListTables
                - dynamodb:DescribeTable
                - cloudwatch:DescribeAlarms
                - logs:DescribeLogGroups
                - ec2:DescribeInstances
                - cloudformation:DescribeStacks
              Resource: '*'
            - Sid: ReadConfiguredHeartbeatTables
              Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  ChannelDirectoryUrl:
    Description: Configure this URL as AWS_CHANNEL_DIRECTORY_URL in the Cloudflare Worker.
    Value: !GetAtt ChannelDirectoryFunctionUrl.FunctionUrl

