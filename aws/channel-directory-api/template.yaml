AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DPI-Bot administrator operations and channel directory API

Parameters:
  DirectoryApiToken:
    Type: String
    NoEcho: true
    MinLength: 32
  TableName:
    Type: String
    Default: EarthquakeData
  MonitoredTableNames:
    Type: String
    Default: EarthquakeData
    Description: Comma-separated DynamoDB table names shown in the administrator system summary.
  HomeServerTableName:
    Type: String
    Default: DPI-BackupFleetState-v51
    Description: DynamoDB heartbeat and failover state table for home servers.
  StateTableName:
    Type: String
    Default: DPI-BackupFleetState-v51
  DeliveryMonitorTableName:
    Type: String
    Default: DPI-DeliveryMonitor-v1
    Description: Read-only delivery aggregation source used by the administrator dashboard.
  OperatingRegions:
    Type: String
    Default: ap-northeast-1,ap-northeast-3
  AutoMonitorFunction:
    Type: String
    Default: dpi-backup-auto-failover-monitor
  IngestEndpoints:
    Type: String
    Default: https://1ar64nf0ma.execute-api.ap-northeast-1.amazonaws.com/ingest,https://2xoazilkij.execute-api.ap-northeast-3.amazonaws.com/ingest
    Description: Comma-separated signed ingest endpoints. The identical delivery ID is sent to each endpoint for deduplication.
  IngestHmacParameter:
    Type: String
    Default: /dpi-bot/final-backup/hmac-secret
  DmdataApiKeyParameter:
    Type: String
    Default: /dpi-bot/dmdata/api-key
    Description: SecureString parameter containing the DMDATA API key used for administrator history lookup.

Resources:
  ChannelDirectoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dpi-channel-directory-api
      Description: Administrator status, controlled operations, XML dispatch, and delivery destination API
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: lambda_function.lambda_handler
      CodeUri: .
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          DIRECTORY_API_TOKEN: !Ref DirectoryApiToken
          MONITORED_TABLE_NAMES: !Ref MonitoredTableNames
          HOME_SERVER_TABLE_NAME: !Ref HomeServerTableName
          STATE_TABLE_NAME: !Ref StateTableName
          DELIVERY_MONITOR_TABLE_NAME: !Ref DeliveryMonitorTableName
          OPERATING_REGIONS: !Ref OperatingRegions
          AUTO_MONITOR_FUNCTION: !Ref AutoMonitorFunction
          INGEST_ENDPOINTS: !Ref IngestEndpoints
          INGEST_HMAC_PARAMETER: !Ref IngestHmacParameter
          DMDATA_API_KEY_PARAMETER: !Ref DmdataApiKeyParameter
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TableName
        - Statement:
            - Sid: ReadOperationalInventory
              Effect: Allow
              Action:
                - lambda:ListFunctions
                - apigateway:GET
                - sqs:ListQueues
                - sqs:GetQueueAttributes
                - dynamodb:ListTables
                - dynamodb:DescribeTable
                - cloudwatch:DescribeAlarms
                - logs:DescribeLogGroups
                - ec2:DescribeInstances
                - ec2:DescribeInstanceStatus
                - cloudformation:ListStacks
                - cloudformation:DescribeStacks
              Resource: '*'
            - Sid: ReadAndWriteOperationalState
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Scan
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StateTableName}
            - Sid: ReadDeliveryMonitor
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:DescribeTable
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DeliveryMonitorTableName}
            - Sid: WriteDeliveryMetadata
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DeliveryMonitorTableName}
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys:
                    - delivery#*
            - Sid: ControlManagedBackupInstances
              Effect: Allow
              Action:
                - ec2:StartInstances
                - ec2:StopInstances
                - ec2:RebootInstances
              Resource:
                - !Sub arn:${AWS::Partition}:ec2:ap-northeast-1:${AWS::AccountId}:instance/*
                - !Sub arn:${AWS::Partition}:ec2:ap-northeast-3:${AWS::AccountId}:instance/*
              Condition:
                StringEquals:
                  ec2:ResourceTag/dpi:backup-managed: 'true'
            - Sid: ControlAutoFailoverMonitor
              Effect: Allow
              Action:
                - lambda:GetFunctionConcurrency
                - lambda:PutFunctionConcurrency
                - lambda:DeleteFunctionConcurrency
                - lambda:InvokeFunction
              Resource:
                - !Sub arn:${AWS::Partition}:lambda:ap-northeast-1:${AWS::AccountId}:function:${AutoMonitorFunction}
                - !Sub arn:${AWS::Partition}:lambda:ap-northeast-3:${AWS::AccountId}:function:${AutoMonitorFunction}
            - Sid: RunIsolatedDeliveryTests
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:dpi-channel-directory-api
                - !Sub arn:${AWS::Partition}:lambda:ap-northeast-1:${AWS::AccountId}:function:dpi-delivery-*
                - !Sub arn:${AWS::Partition}:lambda:ap-northeast-3:${AWS::AccountId}:function:dpi-delivery-*
                - !Sub arn:${AWS::Partition}:lambda:ap-northeast-1:${AWS::AccountId}:function:new_*
                - !Sub arn:${AWS::Partition}:lambda:ap-northeast-3:${AWS::AccountId}:function:new_*
            - Sid: RunCandidateQueueTests
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub arn:${AWS::Partition}:sqs:ap-northeast-1:${AWS::AccountId}:dpi-ha-candidate-ap-northeast-1
                - !Sub arn:${AWS::Partition}:sqs:ap-northeast-3:${AWS::AccountId}:dpi-ha-candidate-ap-northeast-3
            - Sid: ReadSecureParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${IngestHmacParameter}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DmdataApiKeyParameter}
            - Sid: DecryptIngestSigningParameter
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  ChannelDirectoryUrl:
    Description: Configure this URL as AWS_CHANNEL_DIRECTORY_URL in the Cloudflare Worker.
    Value: !GetAtt ChannelDirectoryFunctionUrl.FunctionUrl

